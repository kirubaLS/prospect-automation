# Render Blueprint: the Apollo prospecting web app (playwright-scraper/src/app.js).
#   Render dashboard -> New + -> Blueprint -> connect this repo -> Apply.
# Free tier: no card, 512 MB RAM (this app uses ~100 MB, no browser),
# spins down after 15 idle minutes and wakes on the next request (~30 s).
# The app pings itself while a job runs so a long batch is not cut off.
#
# After the first deploy, set APOLLO_API_KEY under the service's
# Environment tab (sync: false = never stored in this repo).
#
# The older n8n + PhantomBuster deployment lives in n8n/render.yaml.
services:
  - type: web
    name: prospect-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APOLLO_API_KEY
        sync: false
      # Free LinkedIn-URL resolution (any one is enough; see README):
      - key: SERPER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_CX
        sync: false
      # LinkedIn activity check (Activity tab): one Apify token per process.
      - key: APIFY_POSTS_TOKEN
        sync: false
      - key: APIFY_COMMENTS_TOKEN
        sync: false
      - key: APIFY_REACTIONS_TOKEN
        sync: false
      - key: APIFY_PROFILE_TOKEN
        sync: false
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: PROJECTS_DIR
        value: /app/projects
