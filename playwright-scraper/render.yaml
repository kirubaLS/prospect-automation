services:
  - type: web
    name: leadstrategus-salesnav-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: LINKEDIN_LI_AT_COOKIE
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY_JSON
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: COMPANIES_SHEET_NAME
        value: Companies
      - key: PROSPECTS_SHEET_NAME
        value: Prospects
      - key: TITLE_KEYWORDS
        value: 'CIO OR "Chief Information Officer" OR "IT Head" OR "Head of IT" OR "IT Director" OR "VP IT" OR COO OR "Head of Procurement" OR "Procurement Director" OR "IT Manager"'
      - key: MAX_PROSPECTS_PER_COMPANY
        value: "15"
      - key: MIN_DELAY_MS
        value: "2000"
      - key: MAX_DELAY_MS
        value: "5000"
      - key: HEADLESS
        value: "true"
      - key: DEBUG_SCRAPER
        value: "false"
      - key: RUN_TOKEN
        sync: false
