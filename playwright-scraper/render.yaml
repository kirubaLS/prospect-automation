services:
  - type: web
    name: leadstrategus-salesnav-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: LINKEDIN_LI_AT_COOKIE
        sync: false
      # file = upload CSV/XLSX at /, download results at /download (default).
      # For Google Sheets instead set sheets + GOOGLE_SERVICE_ACCOUNT_KEY_JSON,
      # SPREADSHEET_ID, COMPANIES_SHEET_NAME, PROSPECTS_SHEET_NAME, RUN_LOG_SHEET_NAME.
      - key: STORAGE_BACKEND
        value: file
      - key: DATA_DIR
        value: /app/data
      - key: MAX_PROSPECTS_PER_COMPANY
        value: "15"
      - key: MIN_DELAY_MS
        value: "2000"
      - key: MAX_DELAY_MS
        value: "5000"
      - key: HEADLESS
        value: "true"
      - key: BLOCK_MEDIA
        value: "true"
      - key: DEBUG_SCRAPER
        value: "false"
      - key: RUN_TOKEN
        sync: false
      - key: NAVIGATION_TIMEOUT_MS
        value: "30000"
      - key: MAX_RETRIES_PER_COMPANY
        value: "1"
      - key: COMPANIES_PER_RUN
        value: "1"
      - key: MIN_RUN_INTERVAL_MS
        value: "300000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TOP_N_PER_COMPANY
        value: "4"
      - key: AUTO_APPROVE_SCORE
        value: "70"
